<!DOCTYPE html>
<html>
<body>

<div id="main">
<p>para1</p>
<p>para2</p>
</div>

<p id="output"></p>

<script>
const x = document.getElementById("main");
const y = x.getElementsByTagName("p");

document.getElementById("output").textContent = y[0].textContent;
setTimeout(() => {
	document.getElementById("output").textContent = x.children[1].textContent;
}, 2000);


</script>

</body>
</html>
